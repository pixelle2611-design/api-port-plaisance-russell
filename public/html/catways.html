<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Catways — Port de Plaisance Russell</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/catways.js" defer></script>
    <meta name="description" content="Application de gestion des catways et réservations pour la capitainerie du Port de Plaisance Russell.">
</head>
<body>
    <header>
        <h1>Gestion des catways</h1>
        <nav>
            <a href="dashboard.html">Tableau de bord</a>
            <a href="reservations.html">Réservations</a>
            <a href="users.html">Utilisateurs</a>
            <a href="/apidoc">Documentation API</a>
            <button id="logoutBtn">Déconnexion</button>
        </nav>
    </header>

    <main>
        <section>
            <h2>Ajouter un catway</h2>
            <form id="createForm">
                <label for="catwayNumber">Numéro</label>
                <input type="number" id="catwayNumber" name="catwayNumber" required>

                <label for="catwayType">Type</label>
                <select id="catwayType" name="catwayType" required>
                    <option value="long">Long</option>
                    <option value="short">Short</option>
                </select>

                <label for="catwayState">État</label>
                <textarea id="catwayState" name="catwayState" rows="3" cols="40" required></textarea>

                <button type="submit">Créer</button>
            </form>
            <p id="createError" role="alert"></p>
        </section>

        <section>
            <h2>Liste des catways</h2>
            <div id="catwaysList"></div>
        </section>
    </main>
</body>
</html>
