<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Utilisateurs — Port de Plaisance Russell</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/users.js" defer></script>
    <meta name="description" content="Application de gestion des catways et réservations pour la capitainerie du Port de Plaisance Russell.">
</head>
<body>
    <header>
        <h1>Gestion des utilisateurs</h1>
        <nav>
            <a href="dashboard.html">Tableau de bord</a>
            <a href="catways.html">Catways</a>
            <a href="reservations.html">Réservations</a>
            <a href="/apidoc">Documentation API</a>
            <button id="logoutBtn">Déconnexion</button>
        </nav>
    </header>

    <main>
        <section>
            <h2>Ajouter un utilisateur</h2>
            <form id="createForm">
                <label for="username">Nom d'utilisateur</label>
                <input type="text" id="username" name="username" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>

                <label for="password">Mot de passe</label>
                <input type="password" id="password" name="password" required minlength="6">

                <button type="submit">Créer</button>
            </form>
            <p id="createError" role="alert"></p>
        </section>

        <section>
            <h2>Liste des utilisateurs</h2>
            <div id="usersList"></div>
        </section>
    </main>
</body>
</html>
