<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Port de Plaisance Russell</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/login.js" defer></script>
    <meta name="description" content="Application de gestion des catways et réservations pour la capitainerie du Port de Plaisance Russell.">
</head>
<body>
    <header>
        <h1>Port de Plaisance Russell</h1>
    </header>

    <main>
        <section>
            <h2>Bienvenue</h2>
            <p>
                Application de gestion des réservations de catways pour la capitainerie
                du port de Russell.
            </p>
        </section>

        <section>
            <h2>Connexion</h2>
            <form id="loginForm">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>

                <label for="password">Mot de passe</label>
                <input type="password" id="password" name="password" required>

                <button type="submit">Se connecter</button>
            </form>
            <p id="loginError" role="alert"></p>
        </section>

        <section>
            <h2>Documentation</h2>
            <a href="/apidoc">Consulter la documentation de l'API</a>
        </section>
    </main>
</body>
</html>
